name: Publicar versão

# Roda quando você envia uma tag de versão, ex.: npm version patch && git push && git push --tags
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes
        run: npm test
      - name: Gerar o instalador (sem publicar)
        run: npx electron-builder --win --x64 --publish never
      - name: Criar a Release com todos os arquivos de uma vez
        shell: bash
        # Uma única chamada evita a Release duplicada que o electron-builder cria ao enviar em paralelo
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/FrioGest-Setup-${GITHUB_REF_NAME#v}.exe" \
            "dist/FrioGest-Setup-${GITHUB_REF_NAME#v}.exe.blockmap" \
            dist/latest.yml \
            --title "${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
